# Serves the dashboard at / and the body measurements folder, read-only, at /data/.
server {
    listen 80;
    server_name _;

    # Home network and Tailscale only. Nothing here is meant for the internet.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;

    root /srv/dashboard;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location ~ /\. { deny all; }

    # Only the dashboard's own files; its tests and deploy files are not served.
    location = / { try_files /index.html =404; }
    location ~ ^/(index\.html|main\.js|dashboard\.js|style\.css)$ { try_files $uri =404; }

    # The two files the app writes, and the photos it saved.
    location = /data/measurements.json { alias /srv/data/measurements.json; expires epoch; }
    location = /data/photos.json { alias /srv/data/photos.json; expires epoch; }
    location ~ ^/data/photos/([\w.-]+\.jpg)$ { alias /srv/data/photos/$1; }

    location / { return 404; }
}
