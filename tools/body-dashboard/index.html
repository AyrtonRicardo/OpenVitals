<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Body Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Body Dashboard</h1>
    <p id="status" role="status">Loading…</p>
    <nav aria-label="Range" id="ranges">
      <button type="button" data-days="30">30 days</button>
      <button type="button" data-days="90" aria-pressed="true">90 days</button>
      <button type="button" data-days="365">1 year</button>
      <button type="button" data-days="all">All</button>
    </nav>
  </header>
  <main>
    <section aria-labelledby="body-title">
      <h2 id="body-title">Body</h2>
      <div class="grid" id="body-cards"></div>
    </section>
    <section aria-labelledby="tape-title">
      <h2 id="tape-title">Circumferences</h2>
      <div class="grid" id="tape-cards"></div>
    </section>
    <section aria-labelledby="photos-title">
      <h2 id="photos-title">Progress photos</h2>
      <p class="hint">Pick two photos to compare them side by side.</p>
      <div id="compare" class="compare" hidden></div>
      <div id="photos" class="photos"></div>
    </section>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
